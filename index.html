<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub ED2 - Simuladores</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
  h1 { color: #89b4fa; font-size: 36px; margin-bottom: 10px; }
  p.subtitle { color: #a6adc8; font-size: 18px; margin-bottom: 40px; }
  .grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
  .card { background: #313244; border: 2px solid #45475a; border-radius: 16px; padding: 30px; width: 300px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card:hover { transform: translateY(-5px); }
  .card h2 { margin: 0 0 15px 0; font-size: 24px; }
  .card p { color: #bac2de; margin-bottom: 25px; flex-grow: 1; }
  .btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; color: #11111b; }
  .btn-blue { background: #89b4fa; } .btn-blue:hover { background: #b4befe; }
  .btn-red { background: #f38ba8; } .btn-red:hover { background: #fab387; }
  .btn-green { background: #a6e3a1; } .btn-green:hover { background: #94e2d5; }
  .btn-yellow { background: #f9e2af; } .btn-yellow:hover { background: #fae3b0; }
  .btn-orange { background: #fab387; } .btn-orange:hover { background: #f9e2af; }

/* Apple Pencil / Scratchpad Mode */
#scratchpad { position: fixed; top: 0; left: 0; z-index: 9998; pointer-events: none; }
#scratchpad.active { pointer-events: auto; cursor: crosshair; }
.pencil-tools { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 9999; }
.pencil-btn { background: #fab387; color: #1e1e2e; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
.pencil-btn:hover { transform: scale(1.1); }
.pencil-btn.active { background: #f38ba8; }
.clear-btn { background: #89b4fa; display: none; }
#scratchpad.active ~ .pencil-tools .clear-btn { display: flex; }

</style>
</head>
<body>
<h1>🕹️ Arcade de ED2</h1>
<p class="subtitle">Selecione o módulo para treinar para a prova</p>
<div class="grid">
  <div class="card" style="border-color: #a6e3a1;">
    <h2 style="color: #a6e3a1;">🌳 Árvore Binária</h2>
    <p>Treine a ordem de visitação dos nós batendo o olho na árvore.</p>
    <button class="btn btn-green" onclick="window.location.href='arv_binaria.html'">Percursos Visuais</button>
  </div>
  <div class="card" style="border-color: #89b4fa;">
    <h2 style="color: #89b4fa;">⚖️ Árvore AVL</h2>
    <p>Calcule FBs e rotacione passo a passo.</p>
    <button class="btn btn-yellow" onclick="window.location.href='avl_calc.html'">1. Calcular FB</button>
    <button class="btn btn-blue" onclick="window.location.href='avl_rot.html'">2. Fazer Rotações</button>
    <button class="btn btn-red" onclick="window.location.href='avl_remocao.html'">3. Remoção Final</button>
  </div>
  <div class="card" style="border-color: #fab387;">
    <h2 style="color: #fab387;">📦 Árvore B</h2>
    <p>Simulador de splits, merges e redistribuição.</p>
    <button class="btn btn-orange" onclick="window.location.href='arvore_b.html'">Modo Split & Merge</button>
  </div>
</div>

<!-- Apple Pencil Script -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  if(document.getElementById('scratchpad')) return; // already injected somehow
  
  const canvas = document.createElement('canvas');
  canvas.id = 'scratchpad';
  document.body.appendChild(canvas);
  
  const tools = document.createElement('div');
  tools.className = 'pencil-tools';
  tools.innerHTML = `<button class="pencil-btn clear-btn" id="clear-btn" title="Limpar Lousa">🗑️</button><button class="pencil-btn" id="pencil-btn" title="Modo Apple Pencil">✏️</button>`;
  document.body.appendChild(tools);

  const ctx = canvas.getContext('2d');
  const pencilBtn = document.getElementById('pencil-btn');
  const clearBtn = document.getElementById('clear-btn');
  let isDrawing = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  pencilBtn.addEventListener('click', () => {
    canvas.classList.toggle('active');
    pencilBtn.classList.toggle('active');
    if(canvas.classList.contains('active')) {
      pencilBtn.textContent = '❌';
      document.body.style.overflow = 'hidden'; // lock scrolling while drawing
    } else {
      pencilBtn.textContent = '✏️';
      document.body.style.overflow = 'auto';
    }
  });

  clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function getPos(e) {
    if(e.touches && e.touches.length > 0) {
       return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function startDraw(e) {
    if(!canvas.classList.contains('active')) return;
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    if(e.cancelable) e.preventDefault();
  }

  function draw(e) {
    if(!isDrawing || !canvas.classList.contains('active')) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = '#f38ba8';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    if(e.cancelable) e.preventDefault();
  }

  function stopDraw() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stopDraw);
  
  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', draw, {passive: false});
  window.addEventListener('touchend', stopDraw);
});
</script>

</body>
</html>
