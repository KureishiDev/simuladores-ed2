<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percursos - Árvore Binária</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    background: #11111b; 
    color: #cdd6f4; 
    margin: 0; 
    padding: 20px 15px 40px 15px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh;
    box-sizing: border-box;
  }
  
  h1 { text-align: center; color: #a6e3a1; margin: 10px 0 4px 0; font-size: 26px; }
  .level-info { text-align: center; margin-bottom: 12px; }
  .level-info h2 { color: #89dceb; margin: 0; font-size: 18px; font-weight: 600; }
  
  /* Layout principal em 2 colunas harmoniosas */
  .game-container { 
    display: flex; 
    gap: 20px; 
    justify-content: center; 
    align-items: stretch; 
    width: 100%; 
    max-width: 960px; 
    margin-top: 5px;
  }
  
  /* Card da Árvore Principal */
  .panel { 
    background: #1e1e2e; 
    padding: 15px; 
    border-radius: 14px; 
    width: 480px; 
    height: 360px; 
    position: relative; 
    border: 2px solid #313244; 
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
    box-sizing: border-box;
    flex-shrink: 0;
  }
  
  .panel svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .panel line { stroke: #585b70; stroke-width: 4; stroke-linecap: round; }
  
  /* Card do Call Stack / Explicação */
  .console-panel { 
    background: #181825; 
    padding: 18px; 
    border-radius: 14px; 
    width: 460px; 
    height: 360px; 
    border: 2px solid #313244; 
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
    box-sizing: border-box;
    display: flex; 
    flex-direction: column;
    flex: 1;
  }
  
  .console-header {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #a6e3a1;
    font-weight: 700;
    font-size: 15px;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid #313244;
  }
  
  #console-text {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.65;
    color: #cdd6f4;
    padding-right: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  
  #console-text::-webkit-scrollbar { width: 6px; }
  #console-text::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  
  /* O Espelho (Barra de Referência Horizontal Compacta) */
  .mirror-panel { 
    background: #181825; 
    border: 2px dashed #45475a; 
    border-radius: 14px; 
    padding: 14px 24px; 
    width: 100%; 
    max-width: 960px; 
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    justify-content: space-between; 
    box-sizing: border-box;
    margin-top: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  
  .mirror-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 380px;
  }
  
  .mirror-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #f38ba8;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .mirror-title { 
    font-size: 22px; 
    font-weight: 800; 
    color: #a6e3a1; 
    margin: 2px 0;
  }
  
  .mirror-desc { 
    color: #a6adc8; 
    font-size: 13px; 
    background: #1e1e2e; 
    padding: 8px 12px; 
    border-radius: 8px; 
    line-height: 1.4; 
    border-left: 3px solid #89b4fa; 
  }
  
  /* Mini Árvore do Espelho */
  .mini-board { 
    position: relative; 
    width: 180px; 
    height: 110px; 
    flex-shrink: 0;
  }
  
  .mini-line { 
    stroke: #585b70; 
    stroke-width: 3; 
    stroke-linecap: round;
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: 1; 
  }
  
  .mini-node { 
    width: 42px; 
    height: 42px; 
    border-radius: 50%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-weight: 800; 
    font-size: 17px; 
    position: absolute; 
    z-index: 2; 
    border: 3px solid #11111b; 
    color: #11111b; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.4); 
    transition: transform 0.25s, box-shadow 0.25s;
  }
  
  .mini-node span { 
    position: absolute; 
    top: -22px; 
    background: #313244; 
    color: #cdd6f4; 
    padding: 1px 6px; 
    border-radius: 4px; 
    font-size: 11px; 
    font-weight: 700;
    border: 1px solid #585b70; 
    white-space: nowrap;
  }
  
  /* Nós Interativos da Árvore */
  .node { 
    width: 46px; 
    height: 46px; 
    background: #313244; 
    color: #cdd6f4; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-weight: bold; 
    font-size: 20px; 
    position: absolute; 
    z-index: 10; 
    border: 3px solid #585b70; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.4); 
    user-select: none; 
    cursor: pointer; 
    transition: 0.2s; 
  }
  .node:hover { transform: scale(1.12); border-color: #a6e3a1; color: #fff; }
  .node.selected { background: #a6e3a1; border-color: #94e2d5; color: #11111b; box-shadow: 0 0 16px rgba(166,227,161,0.5); }
  .node.error { background: #f38ba8; border-color: #eba0ac; color: #11111b; animation: shake 0.4s; }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%, 75% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
  }
  
  /* Sequência de Resposta */
  .sequence-box { 
    background: #181825; 
    border: 2px solid #313244; 
    border-radius: 10px; 
    padding: 12px 20px; 
    margin-top: 14px; 
    min-height: 28px; 
    width: 100%; 
    max-width: 960px; 
    display: flex; 
    gap: 8px; 
    font-size: 19px; 
    font-weight: bold; 
    color: #a6e3a1; 
    justify-content: center; 
    align-items: center; 
    box-sizing: border-box;
    flex-wrap: wrap;
  }
  
  .feedback { 
    margin-top: 12px; 
    font-size: 16px; 
    font-weight: 600; 
    min-height: 24px; 
    padding: 8px 18px; 
    border-radius: 8px; 
    transition: 0.3s; 
    opacity: 0; 
    text-align: center;
  }
  .feedback.show { opacity: 1; }
  .success { background: rgba(166, 227, 161, 0.15); color: #a6e3a1; border: 1px solid #a6e3a1; }
  .error { background: rgba(243, 139, 168, 0.15); color: #f38ba8; border: 1px solid #f38ba8; }
  
  button#btn-next { 
    background: #a6e3a1; 
    color: #11111b; 
    border: none; 
    padding: 12px 32px; 
    font-size: 17px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: 700; 
    transition: 0.2s; 
    margin-top: 14px; 
    display: none; 
  }
  button#btn-next:hover { background: #94e2d5; transform: translateY(-1px); }
  
  .voltar { position: absolute; top: 15px; left: 15px; background: #313244; color: #cdd6f4; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .voltar:hover { background: #45475a; }

  /* Animação Sequencial Fluida do Espelho */
  .pulse-1 { animation: pulse-seq 2.4s infinite; animation-delay: 0s; }
  .pulse-2 { animation: pulse-seq 2.4s infinite; animation-delay: 0.8s; }
  .pulse-3 { animation: pulse-seq 2.4s infinite; animation-delay: 1.6s; }
  @keyframes pulse-seq {
    0% { transform: scale(1); box-shadow: 0 4px 8px rgba(0,0,0,0.4); filter: brightness(1); }
    18% { transform: scale(1.18); box-shadow: 0 0 16px 4px #a6e3a1; filter: brightness(1.35); }
    36%, 100% { transform: scale(1); box-shadow: 0 4px 8px rgba(0,0,0,0.4); filter: brightness(1); }
  }

  /* Responsividade iPad / Celular */
  @media (max-width: 1024px) {
    .game-container { flex-direction: column; align-items: center; }
    .panel { width: 100%; max-width: 520px; }
    .console-panel { width: 100%; max-width: 520px; height: 250px; }
    .mirror-panel { flex-direction: column; text-align: center; gap: 14px; padding: 16px; }
    .mirror-left { align-items: center; max-width: 100%; }
    .sequence-box { width: 100%; }
  }
</style>

let currentLevel = 0; let currentIndex = 0;
const ui = {
  levelName: document.getElementById('level-name'), svg: document.getElementById('svg'),
  nodes: document.getElementById('nodes'), seq: document.getElementById('sequence'),
  fbk: document.getElementById('feedback'), btn: document.getElementById('btn-next'),
  mTitle: document.getElementById('mirror-title'), mDesc: document.getElementById('mirror-desc'),
  mR: document.getElementById('mini-R'), mE: document.getElementById('mini-E'), mD: document.getElementById('mini-D')
};

function showMsg(msg, type) { ui.fbk.innerHTML = msg; ui.fbk.className = `feedback show ${type}`; }

function drawLine(svg, x1, y1, x2, y2) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1 + 23); line.setAttribute("y1", y1 + 23);
  line.setAttribute("x2", x2 + 23); line.setAttribute("y2", y2 + 23);
  svg.appendChild(line);
}

function updateMirror(mirrorConfig) {
  ui.mTitle.textContent = mirrorConfig.title;
  ui.mDesc.innerHTML = mirrorConfig.desc;
  
  // Atualiza crachás
  ui.mR.innerHTML = `<span>${mirrorConfig.order.R}</span>R`;
  ui.mE.innerHTML = `<span>${mirrorConfig.order.E}</span>E`;
  ui.mD.innerHTML = `<span>${mirrorConfig.order.D}</span>D`;
  
  // Aplica classe de pulso com delay sincronizado na ordem 1º -> 2º -> 3º
  ui.mR.className = "mini-node " + (mirrorConfig.order.R === "1º" ? "pulse-1" : (mirrorConfig.order.R === "2º" ? "pulse-2" : "pulse-3"));
  ui.mE.className = "mini-node " + (mirrorConfig.order.E === "1º" ? "pulse-1" : (mirrorConfig.order.E === "2º" ? "pulse-2" : "pulse-3"));
  ui.mD.className = "mini-node " + (mirrorConfig.order.D === "1º" ? "pulse-1" : (mirrorConfig.order.D === "2º" ? "pulse-2" : "pulse-3"));
}

function loadLevel(idx) {
  const lvl = levels[idx];
  ui.levelName.textContent = lvl.name;
  updateMirror(lvl.mirror);
  
  ui.svg.innerHTML = ''; ui.nodes.innerHTML = ''; ui.seq.innerHTML = '';
  ui.fbk.className = 'feedback';
  if(document.getElementById('console-text')) document.getElementById('console-text').innerHTML = lvl.explanations[0];
 ui.btn.style.display = 'none';
  currentIndex = 0;
  
  lvl.links.forEach(l => {
    const n1 = lvl.nodes.find(n => n.id === l[0]); const n2 = lvl.nodes.find(n => n.id === l[1]);
    drawLine(ui.svg, n1.x, n1.y, n2.x, n2.y);
  });
  
  lvl.nodes.forEach(n => {
    const el = document.createElement('div'); el.className = 'node';
    el.id = n.id; el.textContent = n.id; el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    
    el.addEventListener('click', () => {
      if(el.classList.contains('selected')) return; 
      
      const expectedNode = lvl.expected[currentIndex];
      if(n.id === expectedNode) {
        el.classList.add('selected');
        const span = document.createElement('span'); span.textContent = n.id + (currentIndex < lvl.expected.length-1 ? " → " : "");
        ui.seq.appendChild(span);
        currentIndex++;
        
        showMsg("Certo! Olhe o espelho para achar o próximo.", "success");
        if(document.getElementById('console-text') && currentIndex < lvl.expected.length) {
            document.getElementById('console-text').innerHTML = lvl.explanations[currentIndex];
        }
        
        if(currentIndex === lvl.expected.length) {
          showMsg("🏆 Percurso perfeito! O espelho não mente.", "success");
          if(document.getElementById('console-text')) {
              document.getElementById('console-text').innerHTML += "<br><br><span style='color:#a6e3a1'>🏆 Travessia concluída com sucesso!</span>";
          }
          ui.btn.style.display = 'inline-block';
        }
      } else {
        el.classList.add('error');
        
        // Contextual error hints based on traversal
        let hint = "Tente novamente.";
        if(lvl.name.includes("RED") && currentIndex === 0) hint = "A regra é Raiz-Esq-Dir. Onde está a Raiz principal?";
        if(lvl.name.includes("ERD") && currentIndex === 0) hint = "A regra é Esq-Raiz-Dir. Qual é o nó MAIS à esquerda possível?";
        if(lvl.name.includes("EDR") && currentIndex === 0) hint = "A regra é Esq-Dir-Raiz. Vá para a extrema Esquerda antes de tudo!";
        
        showMsg(`Ops! O nó <b>${expectedNode}</b> deveria vir antes do <b>${n.id}</b>.<br><span style="font-size:14px;font-weight:normal;">Dica: ${hint}</span>`, "error");
        setTimeout(() => el.classList.remove('error'), 400);
      }
    });
    
    ui.nodes.appendChild(el);
  });
}

ui.btn.addEventListener('click', () => {
  currentLevel++;
  if (currentLevel < levels.length) {
    loadLevel(currentLevel);
  } else {
    ui.levelName.textContent = "Parabéns! 🎉";
    document.querySelector('.mirror-panel').style.display = 'none';
    ui.svg.innerHTML = ''; ui.nodes.innerHTML = ''; ui.seq.innerHTML = '';
    ui.btn.style.display = 'none'; ui.fbk.style.display = 'none';
  }
});

loadLevel(0);
</script>

<!-- Apple Pencil Script -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  if(document.getElementById('scratchpad')) return; // already injected somehow
  
  const canvas = document.createElement('canvas');
  canvas.id = 'scratchpad';
  document.body.appendChild(canvas);
  
  const tools = document.createElement('div');
  tools.className = 'pencil-tools';
  tools.innerHTML = `<button class="pencil-btn clear-btn" id="clear-btn" title="Limpar Lousa">🗑️</button><button class="pencil-btn" id="pencil-btn" title="Modo Apple Pencil">✏️</button>`;
  document.body.appendChild(tools);

  const ctx = canvas.getContext('2d');
  const pencilBtn = document.getElementById('pencil-btn');
  const clearBtn = document.getElementById('clear-btn');
  let isDrawing = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  pencilBtn.addEventListener('click', () => {
    canvas.classList.toggle('active');
    pencilBtn.classList.toggle('active');
    if(canvas.classList.contains('active')) {
      pencilBtn.textContent = '❌';
      document.body.style.overflow = 'hidden'; // lock scrolling while drawing
    } else {
      pencilBtn.textContent = '✏️';
      document.body.style.overflow = 'auto';
    }
  });

  clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function getPos(e) {
    if(e.touches && e.touches.length > 0) {
       return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function startDraw(e) {
    if(!canvas.classList.contains('active')) return;
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    if(e.cancelable) e.preventDefault();
  }

  function draw(e) {
    if(!isDrawing || !canvas.classList.contains('active')) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = '#f38ba8';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    if(e.cancelable) e.preventDefault();
  }

  function stopDraw() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stopDraw);
  
  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', draw, {passive: false});
  window.addEventListener('touchend', stopDraw);
});
</script>
