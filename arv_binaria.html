<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percursos - Árvore Binária</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  h1 { text-align: center; color: #a6e3a1; margin-bottom: 5px; }
  .level-info { text-align: center; margin-bottom: 10px; max-width: 600px; }
  .level-info h2 { color: #94e2d5; margin: 0 0 10px 0; }
  
  .game-container { display: flex; gap: 30px; justify-content: center; align-items: stretch; margin-top: 10px; flex-wrap: wrap; }
  
  .panel { background: #313244; padding: 20px; border-radius: 12px; width: 450px; height: 350px; position: relative; border: 2px solid #45475a; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
  
  .mirror-panel { background: #181825; border: 2px dashed #585b70; border-radius: 12px; padding: 20px; width: 300px; display: flex; flex-direction: column; align-items: center; }
  .mirror-panel h3 { color: #f38ba8; margin-top: 0; font-size: 22px; margin-bottom: 5px; }
  .mirror-title { font-size: 28px; font-weight: bold; color: #a6e3a1; margin-bottom: 15px; }
  
  .mini-board { position: relative; width: 200px; height: 120px; margin-bottom: 15px; }
  .mini-line { stroke: #6c7086; stroke-width: 3; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  .mini-node { width: 46px; height: 46px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; position: absolute; z-index: 2; border: 3px solid #11111b; color: #11111b; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
  .mini-node span { position: absolute; top: -25px; background: #313244; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; border: 1px solid #585b70; }
  
  .mirror-desc { color: #bac2de; font-size: 14px; text-align: center; background: #313244; padding: 15px; border-radius: 8px; line-height: 1.4; border-left: 4px solid #89b4fa; }

  .node { width: 46px; height: 46px; background: #45475a; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; position: absolute; z-index: 10; border: 3px solid #6c7086; box-shadow: 0 4px 6px rgba(0,0,0,0.4); user-select: none; cursor: pointer; transition: 0.2s; }
  .node:hover { transform: scale(1.1); border-color: #a6e3a1; }
  .node.selected { background: #a6e3a1; border-color: #94e2d5; color: #11111b; }
  .node.error { background: #f38ba8; border-color: #eba0ac; animation: shake 0.4s; }
  
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }

  .panel svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .panel line { stroke: #6c7086; stroke-width: 4; stroke-linecap: round; }
  
  .sequence-box { background: #181825; border: 2px solid #585b70; border-radius: 8px; padding: 15px; margin-top: 20px; min-height: 30px; width: 100%; max-width: 780px; display: flex; gap: 10px; font-size: 20px; font-weight: bold; color: #a6e3a1; justify-content: center; align-items: center; }
  
  .feedback { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 25px; padding: 10px 20px; border-radius: 8px; transition: 0.3s; opacity: 0; }
  .feedback.show { opacity: 1; }
  .success { background: rgba(166, 227, 161, 0.2); color: #a6e3a1; border: 1px solid #a6e3a1; }
  .error { background: rgba(243, 139, 168, 0.2); color: #f38ba8; border: 1px solid #f38ba8; }
  
  button { background: #a6e3a1; color: #11111b; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 20px; display: none; }
  button:hover { background: #94e2d5; }
  
  .voltar { position: absolute; top: 20px; left: 20px; background: #45475a; color: #cdd6f4; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; }
  .voltar:hover { background: #585b70; }
</style>
</head>
<body>

<a href="index.html" class="voltar">⬅ Voltar ao Hub</a>
<button class="voltar" style="left: auto; right: 20px; cursor: pointer; border: none; font-size: 14px; font-family: inherit;" onclick="loadLevel(currentLevel)">🔄 Refazer Nível</button>

<h1>🌳 Percursos Visuais</h1>
<div class="level-info">
  <h2 id="level-name">Carregando...</h2>
</div>

<div class="game-container">
  <!-- Painel da Árvore Real -->
  <div class="panel">
    <svg id="svg"></svg>
    <div id="nodes"></div>
  </div>

  <!-- Painel do Espelho (Regra Visual) -->
  <div class="mirror-panel">
    <h3>🪞 O Espelho</h3>
    <div class="mirror-title" id="mirror-title">RED</div>
    
    <div class="mini-board">
      <svg class="mini-line">
        <line x1="100" y1="23" x2="50" y2="83"></line>
        <line x1="100" y1="23" x2="150" y2="83"></line>
      </svg>
      <!-- Backgrounds controlados via JS para reforçar a ordem 1, 2, 3 -->
      <div class="mini-node" id="mini-R" style="left: 77px; top: 0px; background: #89b4fa;"><span>Raiz</span>R</div>
      <div class="mini-node" id="mini-E" style="left: 27px; top: 60px; background: #f38ba8;"><span>Esq</span>E</div>
      <div class="mini-node" id="mini-D" style="left: 127px; top: 60px; background: #f9e2af;"><span>Dir</span>D</div>
    </div>
    
    <div class="mirror-desc" id="mirror-desc">
      Carregando mentalidade...
    </div>
  </div>
</div>

<div class="sequence-box" id="sequence"></div>
<div id="feedback" class="feedback"></div>
<button id="btn-next">Próximo Percurso</button>

<script>
const levels = [
  {
    name: "Nível 1: Pré-Ordem (RED)",
    nodes: [
      { id: "A", x: 200, y: 30 },
      { id: "B", x: 100, y: 120 },
      { id: "D", x: 50,  y: 210 },
      { id: "C", x: 300, y: 120 },
      { id: "E", x: 250, y: 210 },
      { id: "F", x: 350, y: 210 }
    ],
    links: [ ["A","B"], ["B","D"], ["A","C"], ["C","E"], ["C","F"] ],
    expected: ["A", "B", "D", "C", "E", "F"],
    mirror: {
      title: "RED (Pré-Ordem)",
      order: { R: "1º", E: "2º", D: "3º" },
      desc: "<strong>Mentalidade: Chegou, Anotou!</strong><br><br>Sempre que você pisar num nó pela primeira vez (Raiz), você clica nele. Depois, você desce TUDO pra Esquerda. Só quando não tiver mais ninguém na esquerda, você olha pra Direita."
    }
  },
  {
    name: "Nível 2: In-Ordem (ERD)",
    nodes: [
      { id: "A", x: 200, y: 30 },
      { id: "B", x: 100, y: 120 },
      { id: "D", x: 50,  y: 210 },
      { id: "C", x: 300, y: 120 },
      { id: "E", x: 250, y: 210 },
      { id: "F", x: 350, y: 210 }
    ],
    links: [ ["A","B"], ["B","D"], ["A","C"], ["C","E"], ["C","F"] ],
    expected: ["D", "B", "A", "E", "C", "F"],
    mirror: {
      title: "ERD (In-Ordem)",
      order: { E: "1º", R: "2º", D: "3º" },
      desc: "<strong>Mentalidade: A Esquerda é a Rainha!</strong><br><br>Não clique na Raiz! Desça cegamente para a Esquerda. Quando bater num nó sem filho esquerdo (ex: D), ele é o 1º. Depois você sobe pro Pai (Raiz), clica, e por fim visita o filho Direito."
    }
  },
  {
    name: "Nível 3: Pós-Ordem (EDR)",
    nodes: [
      { id: "A", x: 200, y: 30 },
      { id: "B", x: 100, y: 120 },
      { id: "D", x: 50,  y: 210 },
      { id: "C", x: 300, y: 120 },
      { id: "E", x: 250, y: 210 },
      { id: "F", x: 350, y: 210 }
    ],
    links: [ ["A","B"], ["B","D"], ["A","C"], ["C","E"], ["C","F"] ],
    expected: ["D", "B", "E", "F", "C", "A"],
    mirror: {
      title: "EDR (Pós-Ordem)",
      order: { E: "1º", D: "2º", R: "3º" },
      desc: "<strong>Mentalidade: Os Filhos Primeiro!</strong><br><br>Um pai (Raiz) só pode ser clicado DEPOIS que 100% dos filhos já foram clicados. Vá para a extrema Esquerda (D), depois Direita (vazio), e por último o Pai (B). A Raiz global (A) sempre será a ÚLTIMA a ser clicada."
    }
  }
];

let currentLevel = 0; let currentIndex = 0;
const ui = {
  levelName: document.getElementById('level-name'), svg: document.getElementById('svg'),
  nodes: document.getElementById('nodes'), seq: document.getElementById('sequence'),
  fbk: document.getElementById('feedback'), btn: document.getElementById('btn-next'),
  mTitle: document.getElementById('mirror-title'), mDesc: document.getElementById('mirror-desc'),
  mR: document.getElementById('mini-R'), mE: document.getElementById('mini-E'), mD: document.getElementById('mini-D')
};

function showMsg(msg, type) { ui.fbk.innerHTML = msg; ui.fbk.className = `feedback show ${type}`; }

function drawLine(svg, x1, y1, x2, y2) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1 + 23); line.setAttribute("y1", y1 + 23);
  line.setAttribute("x2", x2 + 23); line.setAttribute("y2", y2 + 23);
  svg.appendChild(line);
}

function updateMirror(mirrorConfig) {
  ui.mTitle.textContent = mirrorConfig.title;
  ui.mDesc.innerHTML = mirrorConfig.desc;
  
  // Update order tags (1º, 2º, 3º)
  ui.mR.innerHTML = `<span>${mirrorConfig.order.R}</span>R`;
  ui.mE.innerHTML = `<span>${mirrorConfig.order.E}</span>E`;
  ui.mD.innerHTML = `<span>${mirrorConfig.order.D}</span>D`;
  
  // Highlight the #1 element to draw attention
  [ui.mR, ui.mE, ui.mD].forEach(el => el.style.boxShadow = "none");
  if(mirrorConfig.order.R === "1º") ui.mR.style.boxShadow = "0 0 15px #a6e3a1";
  if(mirrorConfig.order.E === "1º") ui.mE.style.boxShadow = "0 0 15px #a6e3a1";
}

function loadLevel(idx) {
  const lvl = levels[idx];
  ui.levelName.textContent = lvl.name;
  updateMirror(lvl.mirror);
  
  ui.svg.innerHTML = ''; ui.nodes.innerHTML = ''; ui.seq.innerHTML = '';
  ui.fbk.className = 'feedback'; ui.btn.style.display = 'none';
  currentIndex = 0;
  
  lvl.links.forEach(l => {
    const n1 = lvl.nodes.find(n => n.id === l[0]); const n2 = lvl.nodes.find(n => n.id === l[1]);
    drawLine(ui.svg, n1.x, n1.y, n2.x, n2.y);
  });
  
  lvl.nodes.forEach(n => {
    const el = document.createElement('div'); el.className = 'node';
    el.id = n.id; el.textContent = n.id; el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    
    el.addEventListener('click', () => {
      if(el.classList.contains('selected')) return; 
      
      const expectedNode = lvl.expected[currentIndex];
      if(n.id === expectedNode) {
        el.classList.add('selected');
        const span = document.createElement('span'); span.textContent = n.id + (currentIndex < lvl.expected.length-1 ? " → " : "");
        ui.seq.appendChild(span);
        currentIndex++;
        
        showMsg("Certo! Olhe o espelho para achar o próximo.", "success");
        
        if(currentIndex === lvl.expected.length) {
          showMsg("🏆 Percurso perfeito! O espelho não mente.", "success");
          ui.btn.style.display = 'inline-block';
        }
      } else {
        el.classList.add('error');
        
        // Contextual error hints based on traversal
        let hint = "Tente novamente.";
        if(lvl.name.includes("RED") && currentIndex === 0) hint = "A regra é Raiz-Esq-Dir. Onde está a Raiz principal?";
        if(lvl.name.includes("ERD") && currentIndex === 0) hint = "A regra é Esq-Raiz-Dir. Qual é o nó MAIS à esquerda possível?";
        if(lvl.name.includes("EDR") && currentIndex === 0) hint = "A regra é Esq-Dir-Raiz. Vá para a extrema Esquerda antes de tudo!";
        
        showMsg(`Ops! O nó <b>${expectedNode}</b> deveria vir antes do <b>${n.id}</b>.<br><span style="font-size:14px;font-weight:normal;">Dica: ${hint}</span>`, "error");
        setTimeout(() => el.classList.remove('error'), 400);
      }
    });
    
    ui.nodes.appendChild(el);
  });
}

ui.btn.addEventListener('click', () => {
  currentLevel++;
  if (currentLevel < levels.length) {
    loadLevel(currentLevel);
  } else {
    ui.levelName.textContent = "Parabéns! 🎉";
    document.querySelector('.mirror-panel').style.display = 'none';
    ui.svg.innerHTML = ''; ui.nodes.innerHTML = ''; ui.seq.innerHTML = '';
    ui.btn.style.display = 'none'; ui.fbk.style.display = 'none';
  }
});

loadLevel(0);
</script>
</body>
</html>
